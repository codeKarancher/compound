name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Test workspace
        run: cargo test --workspace

  linux-enforcement:
    name: Linux enforcement tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Landlock plan/runtime tests
        run: |
          cargo test -p compound-fs --test landlock_plan
          cargo test -p compound-runtime --test exec_runtime
          cargo test -p compound-cli --test linux_landlock_enforcement

  privileged-network:
    name: Privileged TPROXY network tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install network tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables python3

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run privileged TPROXY integration tests
        env:
          COMPOUND_RUN_PRIVILEGED_NET_TESTS: "1"
        run: sudo -E env "PATH=$PATH" cargo test -p compoundd --test tproxy_adversarial -- --nocapture
